# Fendix Security Scan — GitLab CI include file.
#
# Generated by `fendix init --ci gitlab`. The default emit path is
# .gitlab-ci.fendix.yml so it doesn't collide with your main
# .gitlab-ci.yml. Add the following line to your main .gitlab-ci.yml
# to wire it in:
#
#   include:
#     - local: .gitlab-ci.fendix.yml
#
# What it does:
#   - Runs on every merge request commit AND on every push to the
#     default branch.
#   - Downloads a tagged fendix release (override FENDIX_VERSION below
#     to pin a different release; latest is recommended once your
#     release pipeline is reproducible).
#   - Produces a GitLab-SAST-compatible JSON report uploaded as the
#     job's `sast` report and as a 30-day artifact.
#   - Gates the pipeline on HIGH+ findings via fendix's --fail-on.
#
# Required permissions: none beyond the project default (Maintainer
# already has these). If your scan target is a private container
# registry, plumb the credential via a masked CI variable.

variables:
  FENDIX_VERSION: "latest"

fendix-security-scan:
  stage: test
  image: alpine:3.19
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache curl ca-certificates tar
    - >
      curl -fsSL
      "https://github.com/Abdel-RahmanSaied/Fendix/releases/${FENDIX_VERSION}/download/fendix-linux-amd64.tar.gz"
      | tar xz -C /usr/local/bin
    - chmod +x /usr/local/bin/fendix
    - fendix version
  script:
    - >
      fendix scan
      --code .
      --format sarif
      --output gl-sast-report.json
      --fail-on HIGH
  artifacts:
    when: always
    reports:
      sast: gl-sast-report.json
    paths:
      - gl-sast-report.json
    expire_in: 30 days
  allow_failure: false
