# Fendix Security Scan — GitLab CI include file.
#
# Generated by `fendix init --ci gitlab`. The default emit path is
# .gitlab-ci.fendix.yml so it doesn't collide with your main
# .gitlab-ci.yml. Add the following line to your main .gitlab-ci.yml
# to wire it in:
#
#   include:
#     - local: .gitlab-ci.fendix.yml
#
# What it does:
#   - Runs on every merge request commit AND on every push to the
#     default branch.
#   - Downloads a pinned fendix release (FENDIX_VERSION + the matching
#     FENDIX_SHA256 below). Bump both together when updating fendix.
#   - Produces a GitLab-SAST-compatible JSON report uploaded as the
#     job's `sast` report and as a 30-day artifact.
#   - Gates the pipeline on HIGH+ findings via fendix's --fail-on.
#
# Required permissions: none beyond the project default (Maintainer
# already has these). If your scan target is a private container
# registry, plumb the credential via a masked CI variable.

variables:
  # Pin to a specific tag — never "latest". An attacker who controls
  # a "latest" tag in the release repository would execute arbitrary
  # code inside your CI job. Bump this together with FENDIX_SHA256.
  FENDIX_VERSION: "v0.13.0"
  # SHA-256 of the linux-amd64 release tarball. Published alongside
  # each tag at:
  #   https://github.com/Abdel-RahmanSaied/Fendix/releases/download/${FENDIX_VERSION}/fendix-linux-amd64.tar.gz.sha256
  FENDIX_SHA256: "REPLACE_WITH_SHA256_FROM_RELEASE_PAGE"

fendix-security-scan:
  stage: test
  image: alpine:3.19
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache curl ca-certificates tar coreutils
    - >
      curl -fsSL -o /tmp/fendix.tar.gz
      "https://github.com/Abdel-RahmanSaied/Fendix/releases/download/${FENDIX_VERSION}/fendix-linux-amd64.tar.gz"
    - echo "${FENDIX_SHA256}  /tmp/fendix.tar.gz" | sha256sum -c -
    - tar xz -C /usr/local/bin -f /tmp/fendix.tar.gz
    - chmod +x /usr/local/bin/fendix
    - fendix version
  script:
    - >
      fendix scan
      --code .
      --format sarif
      --output gl-sast-report.json
      --fail-on HIGH
  artifacts:
    when: always
    reports:
      sast: gl-sast-report.json
    paths:
      - gl-sast-report.json
    expire_in: 30 days
  allow_failure: false
