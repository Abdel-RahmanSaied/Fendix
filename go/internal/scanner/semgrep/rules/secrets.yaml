rules:
  # Rule 1: Hardcoded password or key assignment
  - id: python-hardcoded-secret-assignment
    patterns:
      - pattern: $KEY = "$VALUE"
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)(password|passwd|pwd|secret|api_key|apikey|auth_token|access_token|client_secret|private_key)
      - metavariable-regex:
          metavariable: $VALUE
          regex: .{6,}
    pattern-not: $KEY = ""
    message: >
      Hardcoded secret found in assignment to '$KEY'.
      Move secrets to environment variables or a secrets manager.
      Rotate the exposed credential immediately.
    languages: [python]
    severity: ERROR
    metadata:
      category: secrets
      cwe: CWE-798
      confidence: HIGH
      fendix_severity: CRITICAL

  # Rule 2: Hardcoded database connection string
  - id: python-hardcoded-db-url
    patterns:
      - pattern: $VAR = "$URL"
      - metavariable-regex:
          metavariable: $URL
          regex: (?i)(postgresql|postgres|mysql|mongodb|redis|mssql|sqlite)://[^:@\s]+:[^@\s]+@
    message: >
      Hardcoded database connection string with embedded credentials found in '$VAR'.
      Store connection strings in environment variables (e.g., DATABASE_URL).
      Rotate the database password immediately.
    languages: [python]
    severity: ERROR
    metadata:
      category: secrets
      cwe: CWE-214
      confidence: HIGH
      fendix_severity: HIGH

  # Rule 3 (Sprint 18): GCP service-account JSON literal embedded in source.
  # The "type":"service_account" key is the signature shape — GCP service-account
  # JSON files include a private_key block, project_id, and client_email. FP class:
  # a documentation example or test fixture committed as a literal would fire.
  # FN class: an external JSON file referenced by path (the right shape — not
  # caught, and not the threat model).
  - id: python-gcp-service-account-inline
    patterns:
      - pattern: $VAR = "$JSON"
      - metavariable-regex:
          metavariable: $JSON
          regex: '"type"\s*:\s*"service_account"'
    message: >
      Inline GCP service-account JSON detected in assignment to '$VAR'.
      Load the credential from an external file via GOOGLE_APPLICATION_CREDENTIALS
      or a secrets manager. Rotate the key in Google Cloud IAM immediately.
    languages: [python]
    severity: ERROR
    metadata:
      category: secrets
      cwe: CWE-798
      confidence: HIGH
      fendix_severity: CRITICAL

  # Rule 4 (Sprint 18): AWS access-key ID literal. AKIA-prefixed 20-char IDs
  # are AWS's documented account-root + IAM-user key format. FP class: a
  # docs/example string AKIAIOSFODNN7EXAMPLE (AWS's own placeholder) fires;
  # tolerable since the rule's value is reminding humans not to copy
  # placeholders into real code. FN class: AKIA keys split across string
  # concatenation aren't caught (the literal is the threat model).
  - id: python-aws-access-key-id-literal
    patterns:
      - pattern: $VAR = "$KEY"
      - metavariable-regex:
          metavariable: $KEY
          regex: '^AKIA[A-Z0-9]{16}$'
    message: >
      AWS access-key ID literal detected in assignment to '$VAR'.
      Use the AWS SDK's credential provider chain (env vars, ~/.aws/credentials,
      instance role) instead of hardcoding. If the key is real, revoke it now.
    languages: [python]
    severity: ERROR
    metadata:
      category: secrets
      cwe: CWE-798
      confidence: HIGH
      fendix_severity: CRITICAL

  # Rule 5 (Sprint 18): Slack incoming-webhook URL hardcoded. Slack's
  # incoming-webhook URLs are bearer-equivalent — anyone with the URL can
  # post messages as the bound integration. FP class: a webhook URL kept
  # in a documentation literal will be flagged (the URL's structure itself
  # is the signal). FN class: webhooks stored in a multi-line concat
  # construction aren't caught.
  - id: python-slack-webhook-url-literal
    patterns:
      - pattern: $VAR = "$URL"
      - metavariable-regex:
          metavariable: $URL
          regex: '^https://hooks\.slack\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[a-zA-Z0-9]+'
    message: >
      Slack incoming-webhook URL hardcoded in '$VAR'.
      Anyone with this URL can post into the bound channel. Rotate the
      webhook in Slack's app config and store the new URL in an env var
      (e.g. SLACK_WEBHOOK_URL).
    languages: [python]
    severity: ERROR
    metadata:
      category: secrets
      cwe: CWE-798
      confidence: HIGH
      fendix_severity: HIGH

  # Rule 6 (Sprint 18): PEM-encoded private key block embedded in source.
  # The "-----BEGIN ... PRIVATE KEY-----" header is the unambiguous PEM
  # signature; any literal carrying it is a leaked key, regardless of variable
  # name. FP class: a test fixture with a throwaway key would fire — the right
  # call is to mark the test fixture explicitly via // nosemgrep, or move the
  # fixture to a non-scanned location. FN class: keys split across lines AND
  # concatenated at runtime are not caught (the static literal is the threat
  # model).
  - id: python-pem-private-key-literal
    patterns:
      - pattern: $VAR = "$KEY"
      - metavariable-regex:
          metavariable: $KEY
          regex: '-----BEGIN ((RSA|EC|DSA|OPENSSH|ENCRYPTED) )?PRIVATE KEY-----'
    message: >
      PEM-encoded private key literal detected in assignment to '$VAR'.
      Move the key out of source control immediately, rotate it on the
      server, and reload from disk or a secrets manager at runtime.
    languages: [python]
    severity: ERROR
    metadata:
      category: secrets
      cwe: CWE-798
      confidence: HIGH
      fendix_severity: CRITICAL
