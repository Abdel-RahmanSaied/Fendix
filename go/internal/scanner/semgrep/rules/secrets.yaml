rules:
  # Rule 1: Hardcoded password or key assignment
  - id: python-hardcoded-secret-assignment
    patterns:
      - pattern: $KEY = "$VALUE"
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i)(password|passwd|pwd|secret|api_key|apikey|auth_token|access_token|client_secret|private_key)
      - metavariable-regex:
          metavariable: $VALUE
          regex: .{6,}
    pattern-not: $KEY = ""
    message: >
      Hardcoded secret found in assignment to '$KEY'.
      Move secrets to environment variables or a secrets manager.
      Rotate the exposed credential immediately.
    languages: [python]
    severity: ERROR
    metadata:
      category: secrets
      cwe: CWE-798
      confidence: HIGH
      fendix_severity: CRITICAL

  # Rule 2: Hardcoded database connection string
  - id: python-hardcoded-db-url
    patterns:
      - pattern: $VAR = "$URL"
      - metavariable-regex:
          metavariable: $URL
          regex: (?i)(postgresql|postgres|mysql|mongodb|redis|mssql|sqlite)://[^:@\s]+:[^@\s]+@
    message: >
      Hardcoded database connection string with embedded credentials found in '$VAR'.
      Store connection strings in environment variables (e.g., DATABASE_URL).
      Rotate the database password immediately.
    languages: [python]
    severity: ERROR
    metadata:
      category: secrets
      cwe: CWE-214
      confidence: HIGH
      fendix_severity: HIGH
