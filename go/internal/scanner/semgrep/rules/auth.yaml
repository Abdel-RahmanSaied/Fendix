rules:
  # Rule 1: Flask route missing @login_required
  - id: flask-missing-login-required
    patterns:
      - pattern: |
          @$APP.route(...)
          def $FUNC(...):
              ...
      - pattern-not: |
          @login_required
          def $FUNC(...):
              ...
      - pattern-not: |
          @$APP.route(...)
          @login_required
          def $FUNC(...):
              ...
    message: >
      Flask route '$FUNC' is missing @login_required decorator.
      Any user can access this endpoint without authentication.
    languages: [python]
    severity: ERROR
    metadata:
      category: auth
      cwe: CWE-306
      confidence: MEDIUM
      fendix_severity: HIGH

  # Rule 2: Django class-based view missing login_required mixin
  - id: django-view-missing-login-required
    patterns:
      - pattern: |
          class $VIEW(View):
              def $METHOD(self, ...):
                  ...
      - pattern-not: |
          class $VIEW(LoginRequiredMixin, ...):
              ...
    message: >
      Django view '$VIEW' does not use LoginRequiredMixin.
      Add LoginRequiredMixin or @login_required to protect this view.
    languages: [python]
    severity: ERROR
    metadata:
      category: auth
      cwe: CWE-306
      confidence: LOW
      fendix_severity: MEDIUM

  # Rule 3: FastAPI route missing Depends(get_current_user) or OAuth2 dependency
  - id: fastapi-route-missing-auth-dependency
    patterns:
      - pattern: |
          @$ROUTER.$METHOD(...)
          def $FUNC(...):
              ...
      - pattern-not: |
          @$ROUTER.$METHOD(...)
          def $FUNC(..., $X: $T = Depends(...), ...):
              ...
      - pattern-not: |
          @$ROUTER.$METHOD(...)
          async def $FUNC(..., $X: $T = Depends(...), ...):
              ...
    message: >
      FastAPI route '$FUNC' has no authentication dependency (Depends(...)).
      Inject a dependency such as Depends(get_current_user) to enforce auth.
    languages: [python]
    severity: WARNING
    metadata:
      category: auth
      cwe: CWE-306
      confidence: LOW
      fendix_severity: MEDIUM

  # Rule 4: jwt.decode called without verify_signature / algorithms.
  # Patterns are single-quoted to make the inline {"verify_signature": ...}
  # JSON valid YAML — without quotes, the embedded ': ' triggers
  # 'mapping values are not allowed in this context' in strict YAML
  # parsers (yaml.v3, ruamel-yaml --rt). Semgrep itself was tolerant of
  # the unquoted form, but Sprint 18's rulepack-catalog audit test in
  # scanner_rulepack_test.go can't parse the file otherwise.
  - id: python-jwt-decode-no-verification
    patterns:
      - pattern: 'jwt.decode($TOKEN, options={"verify_signature": False, ...}, ...)'
      - pattern: 'jwt.decode($TOKEN, algorithms=["none"], ...)'
    message: >
      JWT decoded with signature verification disabled.
      This allows an attacker to forge tokens.
      Remove options={"verify_signature": False} and specify a strong algorithm.
    languages: [python]
    severity: ERROR
    metadata:
      category: auth
      cwe: CWE-347
      confidence: HIGH
      fendix_severity: CRITICAL

  # Rule 5 (Sprint 18): Django function-based view with no auth decorator.
  # FP class: a view that delegates auth to middleware (e.g. AuthenticationMiddleware
  # + a project-wide LOGIN_URL redirect) will be flagged. FN class: views protected
  # by a custom decorator whose name doesn't match the pattern-not list will be
  # flagged. Confidence: LOW to reflect both — orchestrator will keep severity ≤ MEDIUM
  # per the LOW-confidence severity-cap rule documented in docs/semgrep-rules.md.
  - id: django-fbv-missing-auth-decorator
    patterns:
      - pattern: |
          @$URLS.path(...)
          def $FUNC(request, ...):
              ...
      - pattern-not: |
          @login_required
          def $FUNC(request, ...):
              ...
      - pattern-not: |
          @permission_required(...)
          def $FUNC(request, ...):
              ...
      - pattern-not: |
          @user_passes_test(...)
          def $FUNC(request, ...):
              ...
      - pattern-not: |
          @staff_member_required
          def $FUNC(request, ...):
              ...
      - pattern-not: |
          @csrf_exempt
          @login_required
          def $FUNC(request, ...):
              ...
    message: >
      Django function-based view '$FUNC' is missing an auth decorator
      (@login_required, @permission_required, @user_passes_test, or
      @staff_member_required). Any unauthenticated user can hit this view.
    languages: [python]
    severity: WARNING
    metadata:
      category: auth
      cwe: CWE-306
      confidence: LOW
      fendix_severity: MEDIUM

  # Rule 6 (Sprint 18): Flask route with no auth decorator above it.
  # FP class: views that authenticate via Flask-Login's session loading + manual
  # `current_user.is_authenticated` check inside the handler body will be flagged.
  # FN class: a project-specific decorator whose name doesn't match the
  # pattern-not list will be flagged. Confidence: LOW for the same reasons.
  - id: flask-route-no-auth-decorator
    patterns:
      - pattern: |
          @$APP.route(...)
          def $FUNC(...):
              ...
      - pattern-not: |
          @$APP.route(...)
          @login_required
          def $FUNC(...):
              ...
      - pattern-not: |
          @$APP.route(...)
          @requires_auth
          def $FUNC(...):
              ...
      - pattern-not: |
          @$APP.route(...)
          @jwt_required(...)
          def $FUNC(...):
              ...
      - pattern-not: |
          @$APP.route(...)
          @auth.login_required
          def $FUNC(...):
              ...
      # Skip the rule when login_required is the @app.route()-level decorator —
      # rule 1 (flask-missing-login-required) already handles that shape.
      - pattern-not: |
          @login_required
          def $FUNC(...):
              ...
    message: >
      Flask route '$FUNC' has no auth-style decorator (@login_required,
      @requires_auth, @jwt_required, or @auth.login_required) directly above
      the @app.route(...) line. Confirm authentication is enforced.
    languages: [python]
    severity: WARNING
    metadata:
      category: auth
      cwe: CWE-306
      confidence: LOW
      fendix_severity: MEDIUM
