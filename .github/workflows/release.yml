name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  # id-token: write is required for cosign keyless signing (Sigstore OIDC).
  # Disabling COSIGN_ENABLED at the repo-vars level keeps this dormant.
  id-token: write

jobs:
  # Guard: tagged releases MUST be cosign-signed. Defaults are user-set
  # repo vars; this job is the enforcement layer so an accidentally-off
  # COSIGN_ENABLED can't produce an unsigned tag in the wild.
  # SECURITY.md and docs/install.md both advertise cosign-verified
  # binaries — this guard keeps those claims honest. To intentionally
  # ship an unsigned tag (debugging only), set vars.COSIGN_ENABLED=allow-unsigned.
  enforce-signing:
    name: Enforce signing on tagged release
    runs-on: ubuntu-latest
    steps:
      - name: Require cosign on v* tags
        run: |
          set -eu
          if [ "${{ vars.COSIGN_ENABLED }}" = "true" ]; then
            echo "cosign signing: enabled — proceeding"
            exit 0
          fi
          if [ "${{ vars.COSIGN_ENABLED }}" = "allow-unsigned" ]; then
            echo "::warning::cosign signing explicitly disabled for this tag (vars.COSIGN_ENABLED=allow-unsigned)"
            exit 0
          fi
          echo "::error::Tagged releases MUST set vars.COSIGN_ENABLED=true (Settings → Secrets and variables → Actions → Variables). To intentionally ship an unsigned tag, set vars.COSIGN_ENABLED=allow-unsigned."
          exit 1

  release:
    name: Build & Release
    runs-on: ubuntu-latest
    needs: enforce-signing
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"

      - name: Bundle Python engine
        run: make embed-engine

      - name: Build binary
        # -trimpath strips $GOPATH from recorded source paths so a binary
        # built on my machine and a binary built in CI have byte-identical
        # debug info; a third party can rebuild from the tagged source and
        # compare hashes without first replaying our $HOME layout.
        # CGO_ENABLED=0 makes the cross-compile explicit — Go's default is
        # 1 when a C toolchain is available, and the plan's "no CGo" rule
        # ([PLAN.md:124](../tasks/enterprise-readiness/PLAN.md)) makes the
        # explicit form the safer one.
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME}"
          BINARY="fendix-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          cd go && go build \
            -trimpath \
            -ldflags="-s -w -X main.Version=${VERSION}" \
            -o "../dist/${BINARY}" \
            ./cmd/fendix/
          cd ../dist && sha256sum "${BINARY}" > "${BINARY}.sha256"

      # nfpm produces .deb and .rpm packages from the just-built linux binary.
      # Skipped for darwin builds (nfpm is linux-package-only). The packages
      # land alongside the bare binary in dist/ so the mirror's existing
      # `fendix-${VERSION}-*` upload glob picks them up automatically.
      - name: Install nfpm
        if: matrix.goos == 'linux'
        run: |
          set -eu
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.40.0

      - name: Build .deb and .rpm packages
        if: matrix.goos == 'linux'
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME}"
          PKG_VERSION="${VERSION#v}"
          PKG_ARCH="${{ matrix.goarch }}"
          BINARY="dist/fendix-${VERSION}-linux-${PKG_ARCH}"
          DEB="dist/fendix-${VERSION}-linux-${PKG_ARCH}.deb"
          RPM="dist/fendix-${VERSION}-linux-${PKG_ARCH}.rpm"

          # nfpm.yaml references ./fendix-binary as a fixed path so the same
          # config covers every arch. Stage it once, package twice, clean up.
          cp "${BINARY}" ./fendix-binary

          export PKG_VERSION PKG_ARCH
          nfpm package --config nfpm.yaml --packager deb --target "${DEB}"
          nfpm package --config nfpm.yaml --packager rpm --target "${RPM}"

          rm ./fendix-binary

          cd dist
          sha256sum "$(basename "${DEB}")" > "$(basename "${DEB}").sha256"
          sha256sum "$(basename "${RPM}")" > "$(basename "${RPM}").sha256"

      # Cosign keyless signing — uses GitHub Actions OIDC + Sigstore Fulcio, no
      # static secrets required. Produces ${BINARY}.sig (raw signature) and
      # ${BINARY}.crt (the Fulcio cert that bound the signature to the GitHub
      # Actions identity). Verify with:
      #
      #   cosign verify-blob \
      #     --certificate fendix-vX.Y.Z-OS-ARCH.crt \
      #     --signature   fendix-vX.Y.Z-OS-ARCH.sig \
      #     --certificate-identity-regexp "^https://github.com/Abdel-RahmanSaied/Fendix/" \
      #     --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
      #     fendix-vX.Y.Z-OS-ARCH
      #
      # Toggle on by setting repo variable COSIGN_ENABLED=true (Settings → Secrets
      # and variables → Actions → Variables tab). The enforce-signing job at the
      # top of this workflow refuses to release a v* tag unless COSIGN_ENABLED
      # is `true` or `allow-unsigned`, so this `if:` is now informational.
      - name: Install cosign
        if: vars.COSIGN_ENABLED == 'true'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: "v2.4.1"

      - name: Sign binary (cosign keyless)
        if: vars.COSIGN_ENABLED == 'true'
        env:
          COSIGN_YES: "true"
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME}"
          BINARY="fendix-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          cd dist
          cosign sign-blob \
            --output-signature "${BINARY}.sig" \
            --output-certificate "${BINARY}.crt" \
            "${BINARY}"

      - name: Sign .deb and .rpm (cosign keyless)
        if: vars.COSIGN_ENABLED == 'true' && matrix.goos == 'linux'
        env:
          COSIGN_YES: "true"
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME}"
          ARCH="${{ matrix.goarch }}"
          cd dist
          for ext in deb rpm; do
            ASSET="fendix-${VERSION}-linux-${ARCH}.${ext}"
            cosign sign-blob \
              --output-signature "${ASSET}.sig" \
              --output-certificate "${ASSET}.crt" \
              "${ASSET}"
          done

      # ─── SBOM generation ────────────────────────────────────────────
      # Produces a CycloneDX-JSON SBOM per shipped artifact. Why
      # CycloneDX over SPDX: NTIA "Minimum Elements for an SBOM" maps
      # cleanly to either format, but CycloneDX is what most
      # procurement checklists (federal FedRAMP, finserv, healthcare)
      # ask for by name. `syft` writes both formats from the same
      # source-of-truth; the choice here is which one we sign and
      # ship. If a customer needs SPDX, they can `syft convert`.
      #
      # syft is installed via `go install` so we don't pull in a new
      # third-party action (which would itself need a SHA pin). The
      # version is pinned; dependabot will bump it.
      - name: Install syft
        run: go install github.com/anchore/syft/cmd/syft@v1.18.1

      - name: Generate SBOMs
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME}"
          BINARY="fendix-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          cd dist
          # syft can scan a binary directly — it reads the Go build
          # manifest baked in by Go 1.18+ (no debug info required, so
          # -ldflags="-s -w" doesn't break this).
          syft "${BINARY}" \
            -o "cyclonedx-json=${BINARY}.cdx.json" \
            -o "spdx-json=${BINARY}.spdx.json"
          sha256sum "${BINARY}.cdx.json"  > "${BINARY}.cdx.json.sha256"
          sha256sum "${BINARY}.spdx.json" > "${BINARY}.spdx.json.sha256"
          # Generate SBOMs for the linux packages too — they share the
          # binary's package graph but include the .deb/.rpm metadata.
          if [ "${{ matrix.goos }}" = "linux" ]; then
            for ext in deb rpm; do
              ASSET="fendix-${VERSION}-linux-${{ matrix.goarch }}.${ext}"
              syft "${ASSET}" -o "cyclonedx-json=${ASSET}.cdx.json"
              sha256sum "${ASSET}.cdx.json" > "${ASSET}.cdx.json.sha256"
            done
          fi

      # Sign the SBOMs the same way the binaries are signed.
      # An attacker who swaps the SBOM out for one that hides a
      # vulnerable dep would otherwise defeat the whole point.
      - name: Sign SBOMs (cosign keyless)
        if: vars.COSIGN_ENABLED == 'true'
        env:
          COSIGN_YES: "true"
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME}"
          BINARY="fendix-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          cd dist
          for sbom in "${BINARY}.cdx.json" "${BINARY}.spdx.json"; do
            cosign sign-blob \
              --output-signature "${sbom}.sig" \
              --output-certificate "${sbom}.crt" \
              "${sbom}"
          done
          if [ "${{ matrix.goos }}" = "linux" ]; then
            for ext in deb rpm; do
              SBOM="fendix-${VERSION}-linux-${{ matrix.goarch }}.${ext}.cdx.json"
              cosign sign-blob \
                --output-signature "${SBOM}.sig" \
                --output-certificate "${SBOM}.crt" \
                "${SBOM}"
            done
          fi

      # ─── SLSA Provenance ────────────────────────────────────────────
      # Generates a SLSA v1.0 build provenance predicate and signs it
      # as an in-toto attestation alongside the binary. The predicate
      # records: who built it (the GitHub Actions identity, bound to
      # the Fulcio cert), what the build was (this workflow run by
      # ID), what the inputs were (commit SHA, ref, repo), and what
      # the output was (binary sha256).
      #
      # We construct the predicate inline rather than calling
      # `slsa-framework/slsa-github-generator` because (a) the
      # reusable workflow expands the trust boundary by another
      # third-party repo we'd have to pin and audit, and (b) the
      # in-toto + cosign path achieves the same verifiability via
      # Rekor. A consumer verifies with:
      #
      #   cosign verify-blob-attestation \
      #     --signature   fendix-vX.Y.Z-OS-ARCH.intoto.jsonl \
      #     --certificate-identity-regexp "^https://github.com/Abdel-RahmanSaied/Fendix/" \
      #     --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
      #     --type slsaprovenance1 \
      #     fendix-vX.Y.Z-OS-ARCH
      #
      # By default this signs at SLSA L2 (hosted-runner, non-forgeable
      # OIDC, automated build, source-versioned). L3 ("isolated,
      # parameterless, hermetic build") is achievable on this
      # workflow because the runner is ephemeral and the build script
      # is pinned by commit SHA via the workflow file — but a formal
      # L3 claim requires a third-party attestor; we claim L2 and let
      # users self-verify the L3 properties.
      - name: Generate SLSA provenance
        if: vars.COSIGN_ENABLED == 'true'
        env:
          COSIGN_YES: "true"
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME}"
          BINARY="fendix-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          cd dist

          # Build the predicate. The schema is SLSA v1.0
          # (https://slsa.dev/spec/v1.0/provenance). buildType
          # is a URI that identifies the build process — we use a
          # repo-local URI so it's unambiguous what produced the
          # binary.
          BINARY_SHA256="$(sha256sum "${BINARY}" | awk '{print $1}')"
          cat > "${BINARY}.predicate.json" <<EOF
          {
            "buildDefinition": {
              "buildType": "https://github.com/Abdel-RahmanSaied/Fendix/build/release/v1",
              "externalParameters": {
                "workflow": {
                  "ref": "${GITHUB_REF}",
                  "repository": "https://github.com/${GITHUB_REPOSITORY}",
                  "path": ".github/workflows/release.yml"
                }
              },
              "internalParameters": {
                "GOOS": "${{ matrix.goos }}",
                "GOARCH": "${{ matrix.goarch }}",
                "CGO_ENABLED": "0",
                "go_version": "1.22"
              },
              "resolvedDependencies": [
                {
                  "uri": "git+https://github.com/${GITHUB_REPOSITORY}@${GITHUB_REF}",
                  "digest": { "sha1": "${GITHUB_SHA}" }
                }
              ]
            },
            "runDetails": {
              "builder": {
                "id": "https://github.com/actions/runner/github-hosted"
              },
              "metadata": {
                "invocationId": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
              }
            }
          }
          EOF

          # Sign the predicate as an in-toto attestation that
          # references the binary's sha256. The output is JSONL with
          # the cosign signature embedded.
          cosign attest-blob --yes \
            --predicate "${BINARY}.predicate.json" \
            --type slsaprovenance1 \
            --output-attestation "${BINARY}.intoto.jsonl" \
            "${BINARY}"

          # Record the SHA we attested over (lets a verifier sanity-
          # check the bound subject without parsing the JSONL).
          echo "${BINARY_SHA256}  ${BINARY}" > "${BINARY}.intoto.jsonl.subject"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fendix-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          # This artifact is transit-only — `publish` and `docker` download
          # it inside the same workflow run. The published assets are the
          # GitHub Release attachments and the GHCR image, both of which
          # persist independently. 1 day is enough headroom for a manual
          # re-run while not retaining unsigned binaries beyond their use.
          retention-days: 1

  publish:
    name: Create GitHub Release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build & Push Docker Image
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up QEMU
        # Required for cross-arch builds on ubuntu-latest (x86_64). Without
        # this the linux/arm64 build step has no emulator and fails.
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          REPO_LC="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          # Docker tag keeps the leading `v` so it matches the Git tag and
          # the binary filename convention (fendix-vX.Y.Z-...). The OCI
          # version label uses the bare semver without `v` per the OCI
          # image-spec convention for org.opencontainers.image.version.
          TAG="${GITHUB_REF_NAME}"
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "image=ghcr.io/${REPO_LC}"
            echo "tag=${TAG}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Build & push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.tag }}
            ${{ steps.tags.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.licenses=MIT

      # Cosign keyless signing for the Docker image. Signs the multi-arch
      # manifest list digest (the recursive --recursive flag fans out to each
      # platform-specific image). Verify after release with:
      #
      #   cosign verify ghcr.io/abdel-rahmansaied/fendix:vX.Y.Z \
      #     # tag matches the Git tag including the `v` prefix; alternatively
      #     # use a digest from the release notes for content-addressable verify
      #     --certificate-identity-regexp "^https://github.com/Abdel-RahmanSaied/Fendix/" \
      #     --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      #
      # Same COSIGN_ENABLED toggle as the binary signing job — flip the repo
      # variable on once you've decided to commit to cosign verification as a
      # supported install path.
      - name: Install cosign
        if: vars.COSIGN_ENABLED == 'true'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: "v2.4.1"

      - name: Sign Docker image (cosign keyless)
        if: vars.COSIGN_ENABLED == 'true'
        env:
          COSIGN_YES: "true"
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.tags.outputs.image }}
        run: |
          set -eu
          # Sign by digest (immutable) rather than by tag (mutable) — best
          # practice per Sigstore docs.
          cosign sign --recursive "${IMAGE}@${DIGEST}"

      # ─── Docker image SBOM + attestation ────────────────────────────
      # `syft <image-ref>` reads the image straight from the registry
      # by digest; we then `cosign attest` the SBOM, which uploads an
      # in-toto attestation to Rekor (the Sigstore transparency log)
      # bound to the same Fulcio cert that signed the image. Verifies
      # with `cosign verify-attestation --type cyclonedx ...`.
      - name: Set up Go (for syft)
        if: vars.COSIGN_ENABLED == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"

      - name: Install syft
        if: vars.COSIGN_ENABLED == 'true'
        run: go install github.com/anchore/syft/cmd/syft@v1.18.1

      - name: Generate + attest image SBOM (cosign keyless)
        if: vars.COSIGN_ENABLED == 'true'
        env:
          COSIGN_YES: "true"
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.tags.outputs.image }}
        run: |
          set -eu
          # Pin to digest so syft scans exactly what cosign signed.
          syft "${IMAGE}@${DIGEST}" -o cyclonedx-json=image.cdx.json
          cosign attest --yes \
            --predicate image.cdx.json \
            --type cyclonedx \
            "${IMAGE}@${DIGEST}"

      # ─── Docker image SLSA provenance attestation ───────────────────
      # Same SLSA v1.0 predicate shape as the binary attestation, but
      # bound to the image digest. Verifies with:
      #
      #   cosign verify-attestation \
      #     --type slsaprovenance1 \
      #     --certificate-identity-regexp "^https://github.com/Abdel-RahmanSaied/Fendix/" \
      #     --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
      #     ghcr.io/abdel-rahmansaied/fendix@sha256:...
      - name: Attest SLSA provenance (image)
        if: vars.COSIGN_ENABLED == 'true'
        env:
          COSIGN_YES: "true"
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.tags.outputs.image }}
        run: |
          set -eu
          cat > image.provenance.json <<EOF
          {
            "buildDefinition": {
              "buildType": "https://github.com/Abdel-RahmanSaied/Fendix/build/docker-release/v1",
              "externalParameters": {
                "workflow": {
                  "ref": "${GITHUB_REF}",
                  "repository": "https://github.com/${GITHUB_REPOSITORY}",
                  "path": ".github/workflows/release.yml"
                },
                "image": "${IMAGE}",
                "digest": "${DIGEST}"
              },
              "resolvedDependencies": [
                {
                  "uri": "git+https://github.com/${GITHUB_REPOSITORY}@${GITHUB_REF}",
                  "digest": { "sha1": "${GITHUB_SHA}" }
                }
              ]
            },
            "runDetails": {
              "builder": {
                "id": "https://github.com/actions/runner/github-hosted"
              },
              "metadata": {
                "invocationId": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
              }
            }
          }
          EOF
          cosign attest --yes \
            --predicate image.provenance.json \
            --type slsaprovenance1 \
            "${IMAGE}@${DIGEST}"

  mirror:
    name: Mirror release to public install repo
    needs: publish
    runs-on: ubuntu-latest
    env:
      MIRROR_REPO: Abdel-RahmanSaied/homebrew-fendix
    steps:
      - name: Checkout engine repo (for templates)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download release-binary artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # Filter to just the binary artifacts. The Docker job uploads its
          # own *.dockerbuild artifact which is unrelated to mirror release
          # contents and was triggering "download all" failures.
          pattern: fendix-*
          path: dist/
          merge-multiple: true

      - name: Read SHA256 checksums
        id: sha
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME}"
          read_sha() {
            awk '{print $1}' "dist/fendix-${VERSION}-$1.sha256"
          }
          {
            echo "version=${VERSION}"
            echo "version_no_v=${VERSION#v}"
            echo "darwin_amd64=$(read_sha darwin-amd64)"
            echo "darwin_arm64=$(read_sha darwin-arm64)"
            echo "linux_amd64=$(read_sha linux-amd64)"
            echo "linux_arm64=$(read_sha linux-arm64)"
          } >> "$GITHUB_OUTPUT"

      - name: Clone mirror repo
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          set -eu
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${MIRROR_REPO}.git" mirror
          cd mirror
          git config user.name "fendix-release-bot"
          git config user.email "fendix-release-bot@users.noreply.github.com"

      - name: Regenerate Formula/fendix.rb in mirror with new SHA256s
        run: |
          set -eu
          cat > mirror/Formula/fendix.rb <<EOF
          # Homebrew formula for Fendix — hybrid API and code security scanner.
          #
          # Tap and install:
          #   brew tap Abdel-RahmanSaied/fendix
          #   brew install fendix
          #
          # This file is auto-regenerated by the engine repo's release.yml on
          # every \`v*\` tag. Hand-edits here will be overwritten on the next
          # release; edit the canonical copy in the engine repo instead.

          class Fendix < Formula
            desc "Hybrid API and code security scanner"
            homepage "https://github.com/Abdel-RahmanSaied/homebrew-fendix"
            license "MIT"
            version "${{ steps.sha.outputs.version_no_v }}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/Abdel-RahmanSaied/homebrew-fendix/releases/download/v#{version}/fendix-v#{version}-darwin-arm64"
                sha256 "${{ steps.sha.outputs.darwin_arm64 }}"
              else
                url "https://github.com/Abdel-RahmanSaied/homebrew-fendix/releases/download/v#{version}/fendix-v#{version}-darwin-amd64"
                sha256 "${{ steps.sha.outputs.darwin_amd64 }}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/Abdel-RahmanSaied/homebrew-fendix/releases/download/v#{version}/fendix-v#{version}-linux-arm64"
                sha256 "${{ steps.sha.outputs.linux_arm64 }}"
              else
                url "https://github.com/Abdel-RahmanSaied/homebrew-fendix/releases/download/v#{version}/fendix-v#{version}-linux-amd64"
                sha256 "${{ steps.sha.outputs.linux_amd64 }}"
              end
            end

            depends_on "python@3.11" => :recommended

            def install
              bin.install Dir["fendix-*"].first => "fendix"
            end

            def caveats
              <<~EOC
                Fendix includes an embedded Python engine for whitebox analysis.
                For best results, ensure Python 3 is installed:
                  brew install python@3.11

                Quick start:
                  fendix scan --url https://api.example.com
                  fendix scan --code ./src --spec openapi.yaml --format html -o report.html
              EOC
            end

            test do
              assert_match "fendix version", shell_output("#{bin}/fendix version")
            end
          end
          EOF

      - name: Sync install.sh and get.fendix.dev Pages bootstrap into mirror
        run: |
          set -eu
          # install.sh is the canonical user-facing installer. Until this
          # step existed, install.sh was hand-committed once and drifted
          # silently from the engine-repo source on every later edit.
          cp scripts/install.sh mirror/install.sh
          chmod 755 mirror/install.sh

          # GitHub Pages bootstrap files for https://get.fendix.dev.
          # CNAME binds the custom domain; .nojekyll skips Jekyll
          # processing; index.html is the browser landing page.
          # The mirror also serves install.sh from this same root.
          cp scripts/release/mirror-pages-bootstrap/CNAME       mirror/CNAME
          cp scripts/release/mirror-pages-bootstrap/.nojekyll   mirror/.nojekyll
          cp scripts/release/mirror-pages-bootstrap/index.html  mirror/index.html

      - name: Commit Formula + install.sh + Pages bootstrap update
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          set -eu
          cd mirror
          git add Formula/fendix.rb install.sh CNAME .nojekyll index.html
          if git diff --cached --quiet; then
            echo "Mirror tree unchanged — nothing to commit."
          else
            git commit -m "chore(release): sync ${{ steps.sha.outputs.version }} (Formula + install.sh + Pages)"
            git push origin HEAD:main
          fi

      - name: Create mirror release with binaries
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
          VERSION: ${{ steps.sha.outputs.version }}
        run: |
          set -eu
          # `dist/fendix-${VERSION}-*` already matches both binaries and
          # `.sha256` sidecar files. Listing both globs would upload each
          # checksum twice and fail with "ReleaseAsset.name already exists".
          ASSETS="dist/fendix-${VERSION}-*"

          # Idempotent: skip if a release already exists at this tag.
          if gh release view "$VERSION" -R "$MIRROR_REPO" >/dev/null 2>&1; then
            echo "Release $VERSION already exists on $MIRROR_REPO — uploading any missing assets."
            gh release upload "$VERSION" \
              -R "$MIRROR_REPO" \
              --clobber \
              $ASSETS
          else
            gh release create "$VERSION" \
              -R "$MIRROR_REPO" \
              --title "$VERSION" \
              --notes "Mirror of $VERSION from the engine repo. See the engine repo CHANGELOG for full release notes." \
              $ASSETS
          fi
